<header class="bureau-header">
  <div class="bureau-brand">
    <img
      class="bureau-emblem"
      ngSrc="/assets/bureau-emblem.png"
      width="72"
      height="72"
      alt=""
      priority
    />
    <div class="bureau-heading">
      <h1>Бюро аномальных происшествий</h1>
      <p class="bureau-motto">
        НАБЛЮДАТЬ <span aria-hidden="true">•</span> ФИКСИРОВАТЬ
        <span aria-hidden="true">•</span> РАССЛЕДОВАТЬ
        <span aria-hidden="true">•</span> ПРЕДОТВРАЩАТЬ
      </p>
    </div>
  </div>

  <div class="bureau-note">
    <p>В некоторых случаях<br />правда опаснее незнания</p>
    <span class="bureau-stamp">СЕКРЕТНО</span>
  </div>

  <div class="bureau-profile">
    <div>
      <p class="bureau-profile__name">Сорокин А. В.</p>
      <p class="bureau-profile__role">Старший исследователь</p>
    </div>
    <button type="button" aria-label="Меню пользователя">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="m3 5 5 6 5-6Z" fill="currentColor" />
      </svg>
    </button>
  </div>
</header>
