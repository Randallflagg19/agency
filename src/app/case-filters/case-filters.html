<label for="caseSearch">Поиск по названию</label>
<input
  #searchField
  type="search"
  placeholder="Поиск по названию"
  id="caseSearch"
  [value]="query()"
  (input)="emitQueryChange(searchField.value)"
/>
<label for="caseStatus">Статус</label>
<select
  #statusField
  id="caseStatus"
  [value]="status()"
  (change)="emitStatusChange(statusField.value)"
>
  <option value="all">Все статусы</option>
  <option value="new">Новое</option>
  <option value="investigating">В работе</option>
  <option value="suspended">Приостановлено</option>
  <option value="closed">Закрыто</option>
</select>
