<main>
  <section class="archive-toolbar" aria-labelledby="archive-title">
    <div class="archive-summary">
      <h2 id="archive-title">Архив дел</h2>
      <p>Каталог зарегистрированных аномальных происшествий</p>
      <p>Всего в архиве: {{ cases.length }} дел.</p>
    </div>
    <app-case-filters
      [query]="searchQuery()"
      (queryChanged)="updateSearchQuery($event)"
      [status]="statusFilter()"
      (statusChanged)="updateStatusFilter($event)"
      [category]="categoryFilter()"
      (categoryChanged)="updateCategoryFilter($event)"
      [threatLevel]="threatLevelFilter()"
      (threatLevelChanged)="updateThreatLevelFilter($event)"
      [regions]="regions"
      [region]="regionFilter()"
      (regionChanged)="updateRegionFilter($event)"
      (resetButtonClicked)="resetFilters()"
    />
  </section>

  <ul class="case-list" aria-label="Дела бюро">
    @for (case of filteredCases(); track case.id) {
      <li>
        <app-case-card
          [incident]="case"
          (caseSelected)="handleCaseSelected($event)"
          [selected]="routeCaseId() === case.id"
        />
      </li>
    } @empty {
      <li>Дела не найдены</li>
    }
  </ul>
  @if (selectedCase(); as incident) {
    <app-case-details [selectedCase]="incident" />
  }
</main>
