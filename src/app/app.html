<main>
  <h1>Бюро аномальных происшествий</h1>

  <app-case-filters
    [query]="searchQuery()"
    (queryChanged)="updateSearchQuery($event)"
    [status]="statusFilter()"
    (statusChanged)="updateCaseStatus($event)"
    [category]="categoryFilter()"
    (categoryChanged)="updateCaseCategory($event)"
  />

  <ul class="case-list" aria-label="Дела бюро">
    @for (case of filteredCases(); track case.id) {
      <li>
        <app-case-card
          [incident]="case"
          (caseSelected)="handleCaseSelected($event)"
          [selected]="selectedCaseId() === case.id"
        />
      </li>
    } @empty {
      <li>Дела не найдены</li>
    }
  </ul>
  @if (selectedCase(); as incident) {
    <app-case-details [selectedCase]="incident" />
  }
</main>
