<label for="case-title">Название дела</label>
<input id="case-title" type="text" [formField]="caseForm.title" />
<p>Введено: {{ draft().title }}</p>
@if (caseForm.title().invalid() && caseForm.title().touched()) {
  @for (error of caseForm.title().errors(); track error) {
    <p>{{ error.message }}</p>
  }
}
